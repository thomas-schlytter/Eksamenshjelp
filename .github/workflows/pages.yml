name: Website (GitHub Pages)

# Publishes site/ — the setup page plus install.sh / install.ps1 — to
# https://thomas030505.github.io/Eksamenshjelp/. Static files, no build: the
# prompts in site/index.html are generated from site/prompts/ by
# scripts/build-site.mjs and committed; this workflow only checks they match.
# Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site/
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Prompts in index.html match site/prompts/
        run: node scripts/build-site.mjs --check
      - name: Install scripts parse
        run: |
          bash -n site/install.sh
          pwsh -NoProfile -Command '$tokens = $null; $errors = $null; $null = [System.Management.Automation.Language.Parser]::ParseFile("$PWD/site/install.ps1", [ref]$tokens, [ref]$errors); if ($errors) { $errors; exit 1 }'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
